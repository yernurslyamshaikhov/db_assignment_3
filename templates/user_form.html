{% extends "base.html" %}
{% block content %}
<h1>{{ 'Edit user %d'|format(uid) if uid else 'New user' }}</h1>
<form method="post">
  <label>Given name</label><input type="text" name="given_name" value="{{ form.get('given_name','') }}" required>
  <label>Surname</label><input type="text" name="surname" value="{{ form.get('surname','') }}" required>
  <label>Email (unique)</label><input type="email" name="email" value="{{ form.get('email','') }}" required>
  <label>Affiliation</label><input type="text" name="affiliation" value="{{ form.get('affiliation','') }}" required>
  <label>Country</label><input type="text" name="country" value="{{ form.get('country','') }}" required>
  <label>Phone number</label><input type="text" name="phone_number" value="{{ form.get('phone_number','') }}" required>

  <p class="muted">Every user must have at least one role.</p>
  <fieldset>
    <legend><label style="display:inline"><input type="checkbox" name="is_author" {{ 'checked' if form.get('is_author') }}> Author profile</label></legend>
    <label>ORCID (optional)</label><input type="text" name="orcid" value="{{ form.get('orcid','') }}" placeholder="0000-0000-0000-0000">
    <label>Research areas (comma-separated; stored as separate rows)</label>
    <input type="text" name="research_areas" value="{{ form.get('research_areas','') }}">
  </fieldset>
  <fieldset>
    <legend><label style="display:inline"><input type="checkbox" name="is_reviewer" {{ 'checked' if form.get('is_reviewer') }}> Reviewer profile</label></legend>
    <label>Years of reviewing experience</label>
    <input type="number" name="years_experience" value="{{ form.get('years_experience','') }}">
    <label>Expertise areas (comma-separated; stored as separate rows)</label>
    <input type="text" name="expertise" value="{{ form.get('expertise','') }}">
    <label>Reviewer pools</label>
    {% for c in confs %}
      <label style="display:inline;font-weight:normal;margin-right:12px">
        <input type="checkbox" name="pools" value="{{ c.conference_id }}" {{ 'checked' if c.conference_id|string in form.get('pools', []) }}>
        {{ c.acronym }} ({{ c.city }})</label>
    {% endfor %}
  </fieldset>
  <p><button>Save</button> <a href="{{ url_for('user_detail', uid=uid) if uid else url_for('users_list') }}">Cancel</a></p>
</form>
{% endblock %}
